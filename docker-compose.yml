services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: cafesysto_db
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cafesysto_db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/cafesysto_db?stringtype=unspecified
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      CAFESYSTO_CORREO_DOMINIO: ${CAFESYSTO_CORREO_DOMINIO}
      CAFESYSTO_ADMIN_USUARIO: ${CAFESYSTO_ADMIN_USUARIO}
      CAFESYSTO_ADMIN_CLAVE: ${CAFESYSTO_ADMIN_CLAVE}

volumes:
  pgdata: